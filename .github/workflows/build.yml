name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      target:
        description: "Plateforme(s) à builder"
        required: true
        default: macos
        type: choice
        options:
          - all
          - windows
          - linux
          - macos

env:
  QT_VERSION: "6.9.1"
  BUILD_TYPE: Release

jobs:
  set-matrix:
    name: Compute build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          WINDOWS='{"os":"windows-latest","key":"windows","artifact_name":"LocaLink-windows"}'
          LINUX='{"os":"ubuntu-latest","key":"linux","artifact_name":"LocaLink-linux"}'
          MACOS='{"os":"macos-latest","key":"macos","artifact_name":"LocaLink-macos"}'

          TARGET="${{ github.event.inputs.target }}"

          case "$TARGET" in
            windows) INCLUDE="[$WINDOWS]" ;;
            linux)   INCLUDE="[$LINUX]" ;;
            macos)   INCLUDE="[$MACOS]" ;;
            *)       INCLUDE="[$WINDOWS,$LINUX,$MACOS]" ;;
          esac

          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: set-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Qt ---
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets qtmultimedia
          cache: true

      # --- OpenSSL ---
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl -y --no-progress

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Le paquet Homebrew précompilé (bottle) cible la dernière version
          # de macOS du runner (ex: 26.0), ce qui rend l'app incompatible
          # avec des Mac plus anciens même si LocaLink lui-même vise macOS 12.
          # Le runner GitHub est en arm64 : on compile donc OpenSSL en
          # binaire universel (arm64 + x86_64) pour supporter aussi les
          # Mac Intel, avec la bonne cible de version macOS.
          OPENSSL_VERSION="3.3.2"
          curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar xzf openssl.tar.gz
          export MACOSX_DEPLOYMENT_TARGET=12.0

          for ARCH in arm64 x86_64; do
            cp -r "openssl-${OPENSSL_VERSION}" "openssl-${OPENSSL_VERSION}-${ARCH}"
            cd "openssl-${OPENSSL_VERSION}-${ARCH}"
            ./Configure "darwin64-${ARCH}-cc" shared no-tests \
              -mmacosx-version-min=12.0 \
              --prefix="$HOME/openssl-macos12-${ARCH}" \
              --openssldir="$HOME/openssl-macos12-${ARCH}"
            make -j"$(sysctl -n hw.ncpu)"
            make install_sw
            cd ..
          done

          # Fusion des deux architectures en binaires universels
          mkdir -p "$HOME/openssl-macos12/lib" "$HOME/openssl-macos12/include"
          cp -r "$HOME/openssl-macos12-arm64/include/." "$HOME/openssl-macos12/include/"
          for LIB in libssl.3.dylib libcrypto.3.dylib libssl.a libcrypto.a; do
            lipo -create \
              "$HOME/openssl-macos12-arm64/lib/$LIB" \
              "$HOME/openssl-macos12-x86_64/lib/$LIB" \
              -output "$HOME/openssl-macos12/lib/$LIB"
          done
          ln -sf libssl.3.dylib "$HOME/openssl-macos12/lib/libssl.dylib"
          ln -sf libcrypto.3.dylib "$HOME/openssl-macos12/lib/libcrypto.dylib"

          echo "OPENSSL_ROOT_DIR=$HOME/openssl-macos12" >> "$GITHUB_ENV"

      # --- Ninja pour un build homogène sur les 3 OS ---
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # --- Configuration CMake ---
      - name: Configure
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTS=OFF \
            ${{ runner.os == 'macOS' && '-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0' || '' }} \
            ${{ runner.os == 'macOS' && '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"' || '' }} \
            ${{ runner.os == 'macOS' && format('-DCMAKE_MODULE_PATH={0}/cmake', github.workspace) || '' }} \
            ${{ runner.os == 'Windows' && '-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl' || '' }}

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # DatabaseManager cherche les migrations SQL à
      # <dossier de l'exécutable>/database/Migrations/*.sql au runtime
      # (avec un repli sur le chemin source, valable uniquement en dev).
      # Sans cette copie, la base livrée ne contient aucune table (à part
      # schema_migrations) et toutes les opérations échouent en silence.
      - name: Bundle DB migrations (Windows/Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          DEST="build/app/database/Migrations"
          mkdir -p "$DEST"
          cp database/Migrations/*.sql "$DEST/"

      - name: Bundle DB migrations (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DEST="build/app/LocaLink.app/Contents/MacOS/database/Migrations"
          mkdir -p "$DEST"
          cp database/Migrations/*.sql "$DEST/"

      # --- Déploiement des dépendances Qt à côté de l'exécutable ---
      # --qmldir permet à windeployqt de scanner les imports QML réellement
      # utilisés (ex: QtQuick.Controls) et de déployer les bons plugins,
      # sinon l'appli plante au lancement avec "plugin ... non trouvé".
      - name: Deploy Qt runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: windeployqt --release --qmldir ui build/app/LocaLink.exe

      # windeployqt ne copie que les DLL Qt : il faut copier les DLL
      # OpenSSL (installées par choco) à côté de l'exécutable, sinon
      # LocaLink.exe échoue au lancement avec "libssl-3-x64.dll introuvable".
      # Le chemin d'installation choco varie selon la version du paquet,
      # donc on cherche les DLL plutôt que de supposer un chemin fixe.
      - name: Copy OpenSSL DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $searchRoots = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\ProgramData\chocolatey\lib\openssl",
            "C:\ProgramData\chocolatey\lib\openssl.light"
          ) | Where-Object { Test-Path $_ }

          $dlls = Get-ChildItem -Path $searchRoots -Recurse -ErrorAction SilentlyContinue `
            -Include "libssl-*.dll", "libcrypto-*.dll" |
            Sort-Object FullName -Unique

          if (-not $dlls) {
            Write-Error "Aucune DLL OpenSSL (libssl-*/libcrypto-*) trouvée sur le runner."
            exit 1
          }

          $seen = @{}
          foreach ($dll in $dlls) {
            if (-not $seen.ContainsKey($dll.Name)) {
              Copy-Item $dll.FullName -Destination "build/app" -Force
              $seen[$dll.Name] = $true
              Write-Host "Copié : $($dll.FullName)"
            }
          }

      - name: Deploy Qt runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: macdeployqt build/app/LocaLink.app -qmldir=ui -dmg

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package
          cp build/app/LocaLink package/
          cp -r build/app/database package/
          cp -r resources/linux package/ 2>/dev/null || true

      # --- Upload des artefacts ---
      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/app/*.exe

      - name: Upload full deployed folder (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-full
          path: build/app/

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: package/

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/app/*.dmg