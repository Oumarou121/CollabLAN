name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      target:
        description: "Plateforme(s) à builder"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - macos

env:
  QT_VERSION: "6.9.1"
  BUILD_TYPE: Release
  # Version des installateurs : augmente a chaque compilation (une nouvelle
  # version remplace proprement la precedente sous Windows).
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  set-matrix:
    name: Compute build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          WINDOWS='{"os":"windows-latest","key":"windows","artifact_name":"LocaLink-windows"}'
          # Ubuntu 22.04 (glibc 2.35) : l'AppImage fonctionne sur toutes les
          # distributions au moins aussi recentes ; compilee sur la derniere
          # Ubuntu, elle aurait exige une distribution de 2024 ou plus.
          LINUX='{"os":"ubuntu-22.04","key":"linux","artifact_name":"LocaLink-linux"}'
          MACOS='{"os":"macos-latest","key":"macos","artifact_name":"LocaLink-macos"}'

          TARGET="${{ github.event.inputs.target }}"

          case "$TARGET" in
            windows) INCLUDE="[$WINDOWS]" ;;
            linux)   INCLUDE="[$LINUX]" ;;
            macos)   INCLUDE="[$MACOS]" ;;
            *)       INCLUDE="[$WINDOWS,$LINUX,$MACOS]" ;;
          esac

          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: set-matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # publication de la release « Derniere compilation »
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Qt ---
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets qtmultimedia
          cache: true

      # --- OpenSSL ---
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl -y --no-progress

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Le paquet Homebrew précompilé (bottle) cible la dernière version
          # de macOS du runner (ex: 26.0), ce qui rend l'app incompatible
          # avec des Mac plus anciens même si LocaLink lui-même vise macOS 12.
          # Le runner GitHub est en arm64 : on compile donc OpenSSL en
          # binaire universel (arm64 + x86_64) pour supporter aussi les
          # Mac Intel, avec la bonne cible de version macOS.
          OPENSSL_VERSION="3.3.2"
          curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar xzf openssl.tar.gz
          export MACOSX_DEPLOYMENT_TARGET=12.0

          for ARCH in arm64 x86_64; do
            cp -r "openssl-${OPENSSL_VERSION}" "openssl-${OPENSSL_VERSION}-${ARCH}"
            cd "openssl-${OPENSSL_VERSION}-${ARCH}"
            ./Configure "darwin64-${ARCH}-cc" shared no-tests \
              -mmacosx-version-min=12.0 \
              --prefix="$HOME/openssl-macos12-${ARCH}" \
              --openssldir="$HOME/openssl-macos12-${ARCH}"
            make -j"$(sysctl -n hw.ncpu)"
            make install_sw
            cd ..
          done

          # Fusion des deux architectures en binaires universels
          mkdir -p "$HOME/openssl-macos12/lib" "$HOME/openssl-macos12/include"
          cp -r "$HOME/openssl-macos12-arm64/include/." "$HOME/openssl-macos12/include/"
          for LIB in libssl.3.dylib libcrypto.3.dylib libssl.a libcrypto.a; do
            lipo -create \
              "$HOME/openssl-macos12-arm64/lib/$LIB" \
              "$HOME/openssl-macos12-x86_64/lib/$LIB" \
              -output "$HOME/openssl-macos12/lib/$LIB"
          done
          ln -sf libssl.3.dylib "$HOME/openssl-macos12/lib/libssl.dylib"
          ln -sf libcrypto.3.dylib "$HOME/openssl-macos12/lib/libcrypto.dylib"

          echo "OPENSSL_ROOT_DIR=$HOME/openssl-macos12" >> "$GITHUB_ENV"

      # --- Ninja pour un build homogène sur les 3 OS ---
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # --- Configuration CMake ---
      - name: Configure
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTS=OFF \
            -DLOCALINK_VERSION=${{ env.APP_VERSION }} \
            ${{ runner.os == 'macOS' && '-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0' || '' }} \
            ${{ runner.os == 'macOS' && '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"' || '' }} \
            ${{ runner.os == 'macOS' && format('-DCMAKE_MODULE_PATH={0}/cmake', github.workspace) || '' }} \
            ${{ runner.os == 'Windows' && '-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl' || '' }}

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # DatabaseManager cherche les migrations SQL à
      # <dossier de l'exécutable>/database/Migrations/*.sql au runtime
      # (avec un repli sur le chemin source, valable uniquement en dev, puis
      # sur la copie embarquée dans l'exécutable, cf. database/CMakeLists.txt).
      # Cette copie sur disque reste la source prioritaire.
      - name: Bundle DB migrations (Windows/Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          DEST="build/app/database/Migrations"
          mkdir -p "$DEST"
          cp database/Migrations/*.sql "$DEST/"

      - name: Bundle DB migrations (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DEST="build/app/LocaLink.app/Contents/MacOS/database/Migrations"
          mkdir -p "$DEST"
          cp database/Migrations/*.sql "$DEST/"

      # --- Déploiement des dépendances Qt à côté de l'exécutable ---
      # --qmldir permet à windeployqt de scanner les imports QML réellement
      # utilisés (ex: QtQuick.Controls) et de déployer les bons plugins,
      # sinon l'appli plante au lancement avec "plugin ... non trouvé".
      # --no-compiler-runtime : par defaut windeployqt ne depose que
      # l'installateur vc_redist.x64.exe, que personne ne lance ; le runtime
      # Visual C++ est copie a cote de l'exe a l'etape suivante.
      - name: Deploy Qt runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: windeployqt --release --no-compiler-runtime --qmldir ui build/app/LocaLink.exe

      # Runtime Visual C++ (msvcp140, vcruntime140, vcruntime140_1...) a cote
      # de l'exe (deploiement "app-local", prevu par Microsoft). Sans lui,
      # LocaLink ne demarre pas sur un poste ou ce runtime est absent ou plus
      # ancien que le compilateur du runner ("VCRUNTIME140_1.dll introuvable",
      # "point d'entree introuvable dans MSVCP140.dll") -- typiquement un
      # Windows 10 ancien ; les postes recents l'ont souvent via d'autres logiciels.
      - name: Copy MSVC runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $redist = $env:VCToolsRedistDir
          if (-not $redist -or -not (Test-Path $redist)) {
            Write-Error "VCToolsRedistDir absent : l'environnement MSVC (msvc-dev-cmd) n'est pas charge."
            exit 1
          }
          $crt = Get-ChildItem (Join-Path $redist "x64") -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $crt) {
            Write-Error "Runtime Visual C++ x64 introuvable sous $redist."
            exit 1
          }
          Get-ChildItem $crt.FullName -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName -Destination "build/app" -Force
            Write-Host "Copié : $($_.FullName)"
          }

      # windeployqt ne copie que les DLL Qt : il faut copier les DLL
      # OpenSSL (installées par choco) à côté de l'exécutable, sinon
      # LocaLink.exe échoue au lancement avec "libssl-3-x64.dll introuvable".
      # Le chemin d'installation choco varie selon la version du paquet,
      # donc on cherche les DLL plutôt que de supposer un chemin fixe.
      - name: Copy OpenSSL DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $searchRoots = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\ProgramData\chocolatey\lib\openssl",
            "C:\ProgramData\chocolatey\lib\openssl.light"
          ) | Where-Object { Test-Path $_ }

          $dlls = Get-ChildItem -Path $searchRoots -Recurse -ErrorAction SilentlyContinue `
            -Include "libssl-*.dll", "libcrypto-*.dll" |
            Sort-Object FullName -Unique

          if (-not $dlls) {
            Write-Error "Aucune DLL OpenSSL (libssl-*/libcrypto-*) trouvée sur le runner."
            exit 1
          }

          $seen = @{}
          foreach ($dll in $dlls) {
            if (-not $seen.ContainsKey($dll.Name)) {
              Copy-Item $dll.FullName -Destination "build/app" -Force
              $seen[$dll.Name] = $true
              Write-Host "Copié : $($dll.FullName)"
            }
          }

      # windeployqt copie les DLL Qt "classiques" (celles liees statiquement
      # a l'exe) mais PAS qopensslbackend.dll : ce plugin TLS est charge
      # dynamiquement au runtime par QSslSocket, donc invisible au scan de
      # dependances de windeployqt. Sans lui dans tls/ a cote de l'exe,
      # QSslSocket::availableBackends() ne liste jamais "openssl" -- meme
      # avec libssl/libcrypto presentes -- et Qt retombe silencieusement sur
      # Schannel (cf. debrief "backend actif avant selection: schannel").
      - name: Copy Qt TLS backend plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $windeployqt = Get-Command windeployqt -ErrorAction SilentlyContinue
          if (-not $windeployqt) {
            Write-Error "windeployqt introuvable dans le PATH -- impossible de localiser l'installation Qt."
            exit 1
          }
          # windeployqt.exe vit dans <qtroot>/bin ; les plugins TLS dans <qtroot>/plugins/tls
          $qtRoot = Split-Path -Parent (Split-Path -Parent $windeployqt.Source)
          $pluginSrc = Join-Path $qtRoot "plugins\tls\qopensslbackend.dll"

          if (-not (Test-Path $pluginSrc)) {
            Write-Error "qopensslbackend.dll introuvable a $pluginSrc -- ce build Qt n'inclut peut-etre pas le backend TLS openssl."
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "build/app/tls" | Out-Null
          Copy-Item $pluginSrc -Destination "build/app/tls" -Force
          Write-Host "Copié : $pluginSrc"

      # Seul SQLite sert ; les autres pilotes (Oracle, PostgreSQL, Firebird...)
      # dependent de DLL clientes absentes et alourdissent le paquet.
      - name: Remove unused SQL drivers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem "build/app/sqldrivers" -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne "qsqlite.dll" } | Remove-Item -Force

      # Chaque DLL importee par l'exe, les DLL et les plugins doit etre dans le
      # dossier ou faire partie de Windows. Le runtime C++, Qt et OpenSSL
      # doivent etre DANS le dossier meme si le runner les a dans System32.
      - name: Verify deployed dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "build/app"
          $shipped = @{}
          Get-ChildItem $out -Recurse -Include *.dll, *.exe | ForEach-Object { $shipped[$_.Name.ToLower()] = $true }
          $mustShip = '^(msvcp140|vcruntime140|concrt140|qt6|lib(crypto|ssl)|av(codec|format|util)|sw(resample|scale)|d3dcompiler_47)'
          $missing = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem $out -Recurse -Include *.dll, *.exe | ForEach-Object {
            $file = $_
            dumpbin /nologo /dependents $file.FullName | ForEach-Object {
              if ($_ -notmatch '^\s+([\w.\-]+\.dll)\s*$') { return }
              $name = $Matches[1].ToLower()
              if ($shipped.ContainsKey($name) -or $name -match '^(api|ext)-ms-win-') { return }
              $inSystem = Test-Path (Join-Path $env:SystemRoot "System32\$name")
              if ($name -match $mustShip -or -not $inSystem) { $missing.Add("$name (requis par $($file.Name))") }
            }
          }
          if ($missing.Count -gt 0) {
            $missing | Sort-Object -Unique | ForEach-Object { Write-Host "Manquant : $_" }
            Write-Error "Dossier de deploiement incomplet."
            exit 1
          }
          Write-Host "Toutes les dependances sont presentes."

      # Image disque a glisser-deposer : LocaLink.app a cote d'un raccourci vers
      # Applications (le .dmg de macdeployqt ne contenait que l'application).
      # Signature ad hoc : sans signature, macOS refuse de lancer une
      # application arm64 modifiee par macdeployqt (« endommagee »). Sans
      # compte developpeur Apple, macOS demande encore une confirmation au
      # premier lancement (Reglages > Confidentialite et securite > Ouvrir).
      - name: Deploy Qt runtime and build DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          macdeployqt build/app/LocaLink.app -qmldir=ui
          codesign --force --deep --sign - build/app/LocaLink.app
          mkdir -p dmg-root
          cp -R build/app/LocaLink.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "LocaLink" -srcfolder dmg-root -ov -format UDZO LocaLink-macos.dmg
          echo "ASSET=LocaLink-macos.dmg" >> "$GITHUB_ENV"

      # AppImage : un seul fichier, a rendre executable puis lancer, sans
      # installation, sur la plupart des distributions (linuxdeploy + Qt).
      - name: Install AppImage tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Bibliotheques que les plugins Qt (xcb, multimedia) referencent :
          # linuxdeploy doit les trouver pour assembler l'AppImage.
          sudo apt-get install -y libfuse2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libegl1 libgl1 libpulse0
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QML_SOURCES_PATHS: ${{ github.workspace }}/ui
          VERSION: ${{ env.APP_VERSION }}
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          ICONS=()
          for size in 64 128 256 512; do ICONS+=(-i "resources/linux/icons/${size}x${size}/localink.png"); done
          # 1. Dossier de l'application avec Qt (plugins, QML).
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e build/app/LocaLink -d resources/linux/localink.desktop "${ICONS[@]}" --plugin qt
          # 2. Module TLS OpenSSL de Qt, charge a l'execution : sans lui,
          #    Qt se rabat sur un module qui refuse les certificats des postes.
          mkdir -p AppDir/usr/plugins/tls
          cp -n "$QT_ROOT_DIR"/plugins/tls/libqopensslbackend.so AppDir/usr/plugins/tls/
          # 3. Image AppImage.
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv LocaLink*.AppImage LocaLink-linux-x86_64.AppImage
          echo "ASSET=LocaLink-linux-x86_64.AppImage" >> "$GITHUB_ENV"

      # --- Publication : release « Derniere compilation » ---
      # Les artefacts d'Actions comptent dans le quota de stockage du compte
      # (2 Go inclus, atteint) ; les fichiers d'une release non. Chaque build
      # remplace donc les fichiers d'une seule release, marquee pre-version, dont
      # le tag suit le commit compile. Rien n'est publie pour une pull request.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Dossier deploye sans les fichiers intermediaires de compilation.
          robocopy build/app dist/LocaLink /E /XD CMakeFiles LocaLink_autogen app_core_autogen /XF *.lib *.obj *.pdb *.ilk *.exp *.cmake *.ninja | Out-Null
          if ($LASTEXITCODE -ge 8) { Write-Error "robocopy a echoue ($LASTEXITCODE)"; exit 1 }
          # Installateur (Inno Setup, cf. packaging/windows/LocaLink.iss) :
          # Program Files, menu Demarrer, pare-feu, desinstallation.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup introuvable."; exit 1 }
          & $iscc /Q "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$PWD\dist\LocaLink" "/DOutputDir=$PWD" packaging\windows\LocaLink.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "La compilation de l'installateur a echoue."; exit 1 }
          Move-Item "LocaLink-Setup-$env:APP_VERSION.exe" "LocaLink-Setup-windows.exe" -Force
          "ASSET=LocaLink-Setup-windows.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: Publish to "Derniere compilation" release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: derniere-compilation
        run: |
          # Creation au premier passage (les trois plateformes peuvent arriver
          # ensemble : une seule creation reussit, les autres la trouvent).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Dernière compilation" --notes "Compilation en cours de publication." \
              || gh release view "$TAG" >/dev/null
          fi
          # Le tag suit le commit compile.
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          cat > release-notes.md <<EOF
          **LocaLink $APP_VERSION** — compilée automatiquement le $(date -u '+%d/%m/%Y à %H:%M UTC') (branche \`$GITHUB_REF_NAME\`, commit ${GITHUB_SHA:0:7}).

          ### Installer LocaLink

          **Windows** (10 version 1809 ou plus récent, 11) — \`LocaLink-Setup-windows.exe\`
          1. Téléchargez et ouvrez le fichier, puis suivez l'assistant.
          2. Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* puis *Exécuter quand même* (l'installateur n'est pas signé).
          3. LocaLink se trouve ensuite dans le menu Démarrer. Pour mettre à jour, installez simplement la nouvelle version par-dessus.

          **macOS** (12 ou plus récent) — \`LocaLink-macos.dmg\`
          1. Ouvrez le fichier et glissez **LocaLink** sur **Applications**.
          2. Au premier lancement, si macOS bloque l'ouverture : *Réglages Système › Confidentialité et sécurité*, puis *Ouvrir quand même* (l'application n'est pas notariée par Apple).

          **Linux** (Ubuntu 22.04, Debian 12, Fedora 36 ou plus récents) — \`LocaLink-linux-x86_64.AppImage\`
          1. Rendez le fichier exécutable : clic droit › *Propriétés* › *Autoriser l'exécution*, ou \`chmod +x LocaLink-linux-x86_64.AppImage\`.
          2. Double-cliquez dessus pour lancer LocaLink (aucune installation).

          Chaque compilation remplace ces fichiers.
          EOF
          gh release edit "$TAG" --prerelease --title "Dernière compilation" --notes-file release-notes.md
          # Anciens fichiers (archives remplacees par les installateurs).
          for old in LocaLink-windows.zip LocaLink-linux.tar.gz; do
            gh release delete-asset "$TAG" "$old" -y >/dev/null 2>&1 || true
          done
          gh release upload "$TAG" "$ASSET" --clobber
